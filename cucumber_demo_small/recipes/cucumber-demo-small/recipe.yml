name: Cucumber Demo Small
description: The small company demo content. One Project with its logo, four Feature media items and five feature directory terms.
type: Content
install:
  - cucumber_projects
config:
  # The Feature media below fill the Gherkin script field. Installing
  # Cucumber Core in one go on plain Drupal can skip Gherkin's own text
  # format, and with it that field, so import both when they are missing.
  # Configuration a site already has is left as it is.
  strict: false
  import:
    gherkin:
      - filter.format.gherkin
      - field.field.media.feature.field_media_gherkin
