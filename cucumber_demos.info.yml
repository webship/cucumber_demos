# Packaging anchor for the cucumber_demos project. It has no code and no
# config; the demos are the cucumber_demo_small, cucumber_demo_medium and
# cucumber_demo_large sub-modules.
#
# It exists because drupal.org's Composer facade (packages.drupal.org) only
# reads the root composer.json when it sits next to the info file of a
# component named after the project. Without this file the published
# drupal/cucumber_demos package requires nothing but drupal/core, and the
# GitLab CI templates name the project after the first sub-module.
name: Cucumber Demos
type: module
description: Packaging anchor for the Cucumber Demo Small, Medium and Large demos. Enable those modules instead.
core_version_requirement: ^11.4 || ^12
package: Cucumber
hidden: true
